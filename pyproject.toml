[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rclone-tray"
version = "0.1.0"
description = "A Windows system tray application for managing rclone mounts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Benincasamatch" },
]
keywords = ["rclone", "mount", "tray", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]

dependencies = [
    "PySide6>=6.7.0",
    "tomli-w>=1.1.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Benincasamatch/Rclone_Tray"
Repository = "https://github.com/Benincasamatch/Rclone_Tray.git"
Documentation = "https://github.com/Benincasamatch/Rclone_Tray"

[project.scripts]
rclone-tray = "rclone_tray.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rclone_tray*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
